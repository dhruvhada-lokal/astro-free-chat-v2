# ─────────────────────────────────────────────────────────────────────────────
# Astrolokal AI free chat: the ONE file you edit (plus prompt_template.md).
# Rules: change one thing at a time, bump prompt_version, run `npm run verify` (and `npm run prodcheck` before a send).
# Every chat is logged with prompt_version, cohort, arm and a hash of this file, so results stay traceable.
#
# Sections:  experiment · timing · pacing · model · persona · style · insight_levels · scripted · monthly_line
#            reply_instructions · topics · guardrails · handoff · assets · cohorts · source (daily users) · ui (every word on screen)
# ─────────────────────────────────────────────────────────────────────────────

experiment:
  id: astro_free_chat_pilot_v1
  prompt_version: free_chat_v4.2   # bump on every change; history in docs/CHANGELOG.md
  # The pilot cohort is FIXED and everyone in it gets the same experience (one arm, weight 100).
  # The control is the holdout, which never gets the WATI message (split when the list is built).
  # To try something new: change the settings below, bump prompt_version, and compare versions over time.
  # Parallel arms are still supported (weights must add up to 100), but don't use them on a fixed cohort.
  arms:
    - id: pilot
      weight: 100
      insight_level: minimal      # minimal | specific (see insight_levels)
      allow: []                   # guard rules this arm may break, e.g. [date_or_year, relative_time] for specific

timing:
  free_seconds: 120                 # length of the free chat
  clock_starts: open                # open = when the chat page opens (AT-style urgency) · first_message = at the first question
  pull_until_seconds_left: 20       # from here, Omkar leaves them on one open thread (the hook) instead of new insights
  idle_nudge_seconds: 25            # user quiet this long → Omkar carries on by himself, until the chat ends. 0 = off
  closing_at_seconds_left: 15       # at 15 s left Omkar sends the closing line (or answers a last message with it)
  handoff_card_at_seconds_left: 10  # app shows the hand-off card
  cta_countdown_seconds: 5          # the button counts down this long when the card appears, then stays (nothing opens by itself). 0 = no countdown
  llm_timeout_ms: 18000              # slower than this → send fallback_reply instead. Real gemini-3.5-flash-lite
                                      # latency here has typically run 10-17s; 18000 covers most of it. Time spent
                                      # waiting on the model no longer drains the user's free_seconds — see
                                      # SessionState.llmWaitMs / secondsLeft() — so a long timeout is now safe to use.
  # The pause right after the opening greeting, before Omkar proactively asks what they want to know (unknown
  # topic) or their own predefined topic question (known topic) — only if they haven't said anything by then.
  # "Typing…" shows at topic_wait_typing_seconds; the question is sent at topic_wait_seconds.
  topic_wait_typing_seconds: 5
  topic_wait_seconds: 7.5

# How messages arrive on screen (milliseconds). Typing time grows with message length, like a real person,
# within typing_min_ms..typing_max_ms. The first message always gets its full typing time, however fast the model replies.
pacing:
  read_delay_ms: 1000          # pause after the user sends, before "typing…" appears
  typing_min_ms: 1500         # shortest "typing…" before a message
  typing_ms_per_char: 35      # extra typing time per character
  typing_max_ms: 3000         # longest "typing…" before a message
  between_messages_ms: 350    # gap after each message before the next "typing…"
  system_note_ms: 1100        # how long "Connecting you to…" / "has joined" each hold
  # The whole first-answer reveal (empathy → "Aapki kundli dekh raha hoon…" → kundli card → chart line → finding →
  # hook) runs on this same deliberate pause-then-type rhythm throughout, instead of the usual length-based typing —
  # so it reads as one slow, considered moment, not a quick burst of bubbles. kundli_gap_ms/kundli_ms govern only the
  # one transition into the card itself; post_kundli_gap_ms/post_kundli_typing_ms govern every other bubble in the
  # reveal (including the empathy opener and the intro line, before the card). The one exception is
  # dramatic_gap_ms: a longer pause used at exactly two moments — right after the card, before the chart line (so
  # that specific reveal feels weightier), and before Omkar's one real engage question later in the chat.
  kundli_gap_ms: 2500          # silence before "typing…" starts, leading into the kundli card
  kundli_ms: 2500              # "typing…" before the kundli card appears, once it starts
  post_kundli_gap_ms: 2500     # silence before "typing…" starts, for every other bubble in the reveal
  post_kundli_typing_ms: 2500  # "typing…" duration for every other bubble in the reveal
  dramatic_gap_ms: 5000        # the longer pause: right after the kundli card (before the chart line), and between
                                # the bridge and the one real question in "engage" (see reply_instructions.engage_bridge)
  # A bubble this long (style.max_words_per_bubble is 12) is never dropped any more — the guard keeps it and flags
  # it "very_long_bubble" (see guardReply in engine.ts); the client just paces it slower instead of losing it.
  long_bubble_words: 18        # word count at which a bubble gets the slower typing treatment below
  long_bubble_typing_ms: 7500  # "typing…" duration for a bubble that long, replacing the usual duration

# Google Gemini, called directly with GEMINI_API_KEY (see .env.example).
model:
  name: gemini-3.5-flash-lite       # Gemini model id; logged with every message
  thinking: minimal                 # minimal | low | medium | high — short chat replies need "minimal" (fastest)
  temperature: 0.6
  max_output_tokens: 500            # room for 3 short bubbles (raise it if thinking goes above minimal: thinking uses it too)

persona:
  name: "Astro Omkar"               # shown in the chat header and used by the AI as its own name
  avatar_url: "/persona/omkar.jpg"  # square photo: a file in public/ ("/persona/x.jpg") or an https:// link. "" shows the initial
  header_label: ""                  # optional line before the status in the header (e.g. "Vedic astrology"). "" = just the status
  verified_badge: true              # green tick next to the name in the header, like AT
  voice: >-
    A warm, experienced Vedic astrologer. Simple everyday words, respectful "aap". Calm and confident, never pushy.
  disclosure_line: "Main Astrolokal ka Astro Sahayak hoon 🙏"

style:
  max_bubbles: 3                    # most bubbles in one reply
  first_answer_bubbles: 3           # bubble 1 = empathy opener, BEFORE the kundli card; 2 and 3 = the finding and the hook, after it
  early_replies: 2                  # the next replies get max_bubbles (a full, warm start)…
  later_bubbles: [2, 3]             # …then each reply picks 2 or 3, like a person
  max_words_per_bubble: 12          # AT-style short texts, but not so tight it chokes a sentence that needs the room:
                                     # 0–12 clean, 13–17 kept but flagged (guardReply's long_bubble), 18+ dropped
  question_budget: 2                # gather's one follow-up + the one fixed question in "engage" (see reply_instructions.engage_bridge); never two replies in a row
  separator: "||"

# How much the AI gives away. The arm picks one.
insight_levels:
  minimal: >-
    GIVE: a clear answer to their first question (the direction and the planet behind it; for "when", a window
    tied to their dasha or a planet's movement), who they are, what this phase feels like, specific details that
    feel true. KEEP for the full reading: the exact timing, the full picture of the partner, job or money, what is
    blocking it and the upay. Don't say you are keeping anything back; just don't go there.
  specific: >-
    GIVE: a clear answer to their first question, and you may use the computed window {window_for_topic}
    if it is not empty. KEEP for later: the full picture, what is blocking it and the upay. Don't say
    you are keeping anything back.

# What each AI reply must do. The app picks one per reply and adds it to the end of prompt_template.md ("THIS REPLY").
reply_instructions:
  # the forced real answer right after their one context-gathering question (stage "gather") has been used —
  # never their actual first message any more, that's "gather" below
  answer: >-
    Give the real answer now, in THREE bubbles, in the simplest, most everyday words — nothing literary or textbook
    (never "vichar", "gehra asar", "nirnay" — say "sochna", "zyada asar", "faisla"). React to the SPECIFIC situation
    they told you (whatever they said when you asked what was going on) — not a generic version of their topic. If
    they said "family pressure, no rishta yet", answer THAT, not shaadi in general.
    Bubble 1 (EMPATHY, said before you even look at the chart): warmly name what they're going through, in plain
    words — this is a feeling, not a chart fact, e.g. "Family ka pressure jhelna sach mein mushkil hota hai."
    Bubble 2 (THE FINDING, after the kundli card and the chart_line — never repeat what chart_line already said):
    acknowledge that right now may be hard, hedged ("ho sakta hai"), then pivot to hope for THEIR specific topic,
    e.g. "Abhi ke samay mein thoda mushkil aa sakti hai, lekin aane wala samay rishte ke liye positive hai." Never a
    chart detail here (dasha/planet/yoga) — chart_line already gave that; this bubble is about their SITUATION and
    hope, not the chart.
    Bubble 3 (THE HOOK, a positive hedge PLUS a soft doubt, never resolved): e.g. "Sab kuch achha ho sakta hai,
    lekin is rishte ko lekar kuch cheezon ka khaas khayal rakhna hoga." Tie the caution to their SPECIFIC situation
    (name it in your own words, never a generic line that could fit any topic) — never say what it is, when, or
    whether it gets better or worse. Leave it completely open.
    All three bubbles may run up to about 15 words if the sentence genuinely needs it; don't force an unnatural cut.
    If they asked WHEN, bubble 2 answers with a phase, not a date: e.g. that it opens up once their current
    antardasha (the one in ABOUT THEM) changes, or that it is already moving in this phase. Don't ask anything yet.
  # they haven't typed anything and went quiet: Omkar starts ({topic} = their topic, or "their life right now")
  start: >-
    They haven't asked anything yet. Start the reading yourself, on {topic}: one warm, specific thing you see in their chart
    and the planet behind it, so they feel seen and want to reply.
  # their actual first message (see CLARIFY_MARKER in engine.ts) — may answer directly or ask one question first
  gather: >-
    This is their very first message and you don't yet know enough to give a real answer. If it already names what they
    want to know AND their specific situation (not just a bare topic word like "shaadi" or "career" on its own), skip
    straight to the real answer instead, reacting to their SPECIFIC situation, not a generic version of the topic, in
    THREE bubbles, in the simplest everyday words — nothing literary or textbook (never "vichar", "gehra asar",
    "nirnay" — say "sochna", "zyada asar", "faisla"):
    bubble 1 (EMPATHY, said before you even look at the chart) warmly names what they're going through, in plain
    words — a feeling, not a chart fact;
    bubble 2 (THE FINDING, after the kundli card and the chart_line — never repeat what chart_line already said)
    acknowledges that right now may be hard, hedged ("ho sakta hai"), then pivots to hope for THEIR specific topic —
    never a chart detail here, chart_line already gave that;
    bubble 3 (THE HOOK) is a positive hedge PLUS a soft doubt tied to their SPECIFIC situation, never resolved —
    never saying what it is, when, or whether it gets better or worse. Leave it completely open.
    All three bubbles may run up to about 15 words if the sentence needs it. Otherwise — just a
    greeting (hi, hello, namaste),
    or a bare topic with nothing else — ask ONE short, warm question to understand their actual situation. A bare
    greeting, or a single topic word with nothing else (just "shaadi", just "career", just "naukri"), is NEVER enough on
    its own, even if you already asked them what they wanted to know and this is their reply to that: still ask, don't
    start a generic reading and don't just greet them back. "They care about: X" in ABOUT THEM only means a keyword was
    matched — it is not their actual question or situation, and does not count as enough on its own either. If they DID
    name a topic (a word like "shaadi", "career", "naukri"), your question must be about that specific topic (e.g.
    "Naukri mein abhi kya dikkat hai?", "Shaadi ke baare mein kya pooch rahe hain?") — never repeat the generic "kis
    baare mein jaanna chahte hain" back to them, they already answered that part. If their message ALSO asks how you
    are, or anything else about you, answer that in a few warm words first — but that alone never counts as enough:
    the same reply must still end by asking what they want to know, same as above. When (and
    only when) you're asking that question, your entire reply must start with exactly "CLARIFY||" (nothing before it)
    followed by the one question,
    so it's never mistaken for the real answer. Never use that marker when you're giving the real answer.
  engage: >-
    Keep them talking and enjoying it, in the simplest everyday words — nothing literary or textbook (never "vichar",
    "gehra asar", "nirnay" — say "sochna", "zyada asar", "faisla"). React to what they just said, in their own words,
    then give ONE new, specific insight about their question (what this phase feels like, a detail about the person,
    the work or the money, the planet behind it — never their rashi/moon sign) that they will want to reply to.
    Never reply with a line that says nothing, like "it's clearly visible in your chart". Never reuse a sentence or an
    opening you have already used. Each reply should make the full picture feel close.
  # The fixed, unconditional shape of this whole phase, by turn count (SessionState.engageTurns) — the same order
  # every single chat, regardless of what the user actually says: turn 1 = engage_bridge (bridge + the one real
  # question, together — fires on the very first engage reply, never waiting on a second user message for the
  # question), turn 2 = engage_cliffhanger, turn 3 = engage_stall. Each of these IS the entire reply on its own
  # turn — the base "engage" reaction+insight above is skipped for turns 1-3 (see buildSystemPrompt's inLadder),
  # never layered underneath, so the model never does "the bridge AND also react and add an insight" in one reply.
  engage_bridge: >-
    This is the ENTIRE reply — exactly TWO bubbles, nothing else. This is their very first reply after the kundli
    reveal ended.
    Bubble 1: a short, confident pivot into looking closer at what they asked — direct and sure of yourself, not
    soft or vague, in your own words, e.g. "Rukiye, detail mein dekh ke batata hoon.", "Ek second, isko gehraai se
    dekh leta hoon.", "Rukiye zara, is baare mein aur dekhta hoon." — write your own version in this tone; never use
    one of these examples word-for-word.
    Bubble 2: ONE short question (the bubble must end in "?") about ONE fact tied to the SPECIFIC thing they told
    you — never a generic version of their topic — about something already true or already happened: how long
    it's been going on, what has already happened, or what is already going on right now. Never ask about their
    hopes, wishes, or what might happen next (never "kya umeed hai", "kaisa rahega", "kab hoga" or similar) —
    always the past or the present, never the future. If nothing more specific fits, "kitne time se" (how long
    this has been going on) almost always works. This is the only question "engage" ever asks; never repeat it or
    ask another one later.
  engage_cliffhanger: >-
    This is the ENTIRE reply — nothing else. In the first bubble, acknowledge the SPECIFIC thing they just told you
    (especially if they just answered the question from engage_bridge); in a second bubble, name THEIR actual
    obstacle or recurring thing, in your own words, using a specific word for it tied to what they told you (e.g.
    "is rukawat", "ye jo baar baar ho raha hai", "is doori" — never a generic noun like "rishta" or "naukri" on its
    own), followed by exactly "ke peeche ek wajah hai…" (ending with "…", nothing more) — e.g. "Is rukawat ke
    peeche ek wajah hai…". Never a generic truism that could fit any chat (never "har rishte ke peeche...", "aise
    mein sabke saath hota hai" style) — it must point at THEIR specific situation, not people or relationships in
    general. Different from the question you were just asked — never repeat its wording or content, and never ask
    another question here.
  engage_stall: >-
    This is the ENTIRE reply — nothing else, and don't repeat an earlier line. In two bubbles: first, say in your
    own words that you are still looking closely at that one specific thing for them ("abhi bhi isi par dekh raha
    hoon" style); second, one positive-leaning line that stops dead right after the word "agar" or "magar" —
    nothing after it, no "…", no punctuation, the sentence is simply left unfinished (e.g. "Kuch achha dikh raha
    hai magar"). This "agar"/"magar" bubble is the only case where a sentence may stay incomplete. Different from
    both the question and the "ke peeche ek wajah hai…" cliffhanger before it — never reuse their wording.
  # the last ~20 seconds (timing.pull_until_seconds_left): leave them wanting the full reading
  hook: >-
    The chat is about to end. Leave them on ONE open thread about what they asked in THIS chat (their words, e.g. their
    gf coming back, not "shaadi" from their profile), never a different topic. Name the specific piece of their answer you can see but haven't told yet (the exact timing, what is
    blocking it, or what will turn it around) and stop there, so they want the full reading right now. Don't explain it,
    don't ask a question, don't mention time running out or another astrologer. If you already opened a thread, make that
    same one sharper with one more detail. Keep it to two short bubbles of 4–7 words, e.g. one naming what you see, one
    naming what is still unsaid.
  # The engine switches to this instead of "hook" above once the engage ladder has already given the cliffhanger
  # or the stalling move (SessionState.engageTurns >= 2) before the clock forced the switch to "hook" — that
  # already left them on an open thread, so hook doesn't open or deepen a second one, it just closes the gap
  # between the two to one single bubble instead of two.
  hook_after_ladder: >-
    The chat is about to end. You already left them on an open thread a moment ago — in ONE short bubble of
    4-7 words, make that SAME thread sharper with one more small detail, in your own words. Never open a new
    thread, never repeat its exact wording, never ask a question, never mention time running out.
  # added when the user has gone quiet (timing.idle_nudge_seconds)
  quiet: >-
    They have gone quiet. Carry on by yourself, like an astrologer still reading their chart: one short, specific
    observation about their topic.

# Lines the ENGINE sends word-for-word (no AI). Edit freely; {variables} are filled in.
# Available: {name} {moon_sign} {mahadasha} {antardasha} {last_topic_label} {persona_name} {monthly_line}
scripted:
  # After "Astro Omkar has joined": a short greeting. The kundli is NOT shown yet. opening[1] is used when the
  # topic isn't known; returning_greeting replaces it for a returning user whose topic is already known.
  opening:
    - "Namaste {name} ji 🙏"
    - "Aapka swagat hai."
  returning_greeting: "Kaise hai aap?"
  # Asked after timing.topic_wait_seconds, only if they haven't said anything by then: their own topic question
  # if it's known (topic_hook below), else the generic topic_prompt. Not bundled into the opening any more.
  topic_prompt: "Kis baare mein jaanna chahte hain aap?"
  topic_hook:                        # the predefined question for a returning user whose topic is known
    shaadi: "Shaadi ke baare mein jaanna hai?"
    naukri: "Naukri ke baare mein jaanna hai?"
    paisa: "Paise ke baare mein jaanna hai?"
    parivaar: "Parivaar ke baare mein jaanna hai?"
    pyaar: "Pyaar ke baare mein jaanna hai?"
    default: "Shaadi, naukri, paisa ya pyaar — kis baare mein jaanna hai?"
  # Stage "gather"'s own fallback once a topic is known (see gatherFollowupLine in engine.ts): a real clarifying
  # follow-up, not topic_hook's yes/no confirmation — so a model failure here still reads like Omkar listened.
  topic_followup:
    shaadi: "Shaadi ko lekar abhi kya dikkat aa rahi hai?"
    naukri: "Naukri mein abhi kya dikkat aa rahi hai?"
    paisa: "Paise ko lekar abhi kya pareshani hai?"
    parivaar: "Ghar mein abhi kya chal raha hai jiski fikar hai?"
    pyaar: "Ismein abhi kya chal raha hai jo aap jaanna chahte hain?"
  # First answer = empathy bubble → chart_intro → kundli card → chart_line → the finding + the hook. chart_intro "" = skip it.
  # No rashi name here: Vedic rashi (Moon-based, sidereal) routinely differs from the Western sun sign someone
  # already knows, and naming it invites a "that's wrong" objection for no reason — the kundli card already
  # shows it as a fact label, so nothing is lost. Dasha stays: nobody has a prior belief about their own
  # dasha to contradict, so it's a free, uncontested "Omkar knows something real about me" moment.
  chart_intro: "Aapki kundli dekh raha hoon…"
  # Framed as an observation ("jaisa ki main dekh pa raha hoon"), not a flat fact statement — and kept separate
  # from the finding bubble that follows it (reply_instructions.answer), so the two never repeat the same idea.
  chart_line: "Jaisa ki main dekh pa raha hoon, abhi aapki kundli mein {mahadasha} ka samay chal raha hai."
  # No birth time → dasha uncertain: used instead of chart_line above, same place, same pacing — never names a
  # planet or dasha we're not sure is right. Positive and tied to THEIR topic instead (never a generic "something
  # good"), keyed the same way as topic_hook/topic_followup; "default" covers an unknown topic.
  chart_line_unsure:
    shaadi: "Jaisa ki main dekh pa raha hoon, aapki kundli mein shaadi ka yog shubh hai."
    naukri: "Jaisa ki main dekh pa raha hoon, aapki kundli mein career ka yog bright hai."
    paisa: "Jaisa ki main dekh pa raha hoon, aapki kundli mein paise ka yog majboot hai."
    parivaar: "Jaisa ki main dekh pa raha hoon, aapki kundli mein parivaar ka yog sukhad hai."
    pyaar: "Jaisa ki main dekh pa raha hoon, aapki kundli mein pyaar ka yog gehra hai."
    default: "Jaisa ki main dekh pa raha hoon, aapki kundli mein abhi ka samay accha hai."
  # Sent at closing_at_seconds_left: the last open thread, just before the hand-off card.
  closing:
    - "{name} ji, ek aur zaroori baat dikh rahi hai…"
  # When the model call fails or gets fully guard-rejected (any stage except "gather" — that one has its own
  # fallback, see topicPromptLine in engine.ts). Deliberately a doubt-hook line, not a flat dead-end statement —
  # a model failure shouldn't feel like the conversation stopped, it should feel like Omkar is still reading.
  fallback_reply: "Par is samay kuch baaton ka aapko khaas dhyaan rakhna hoga."
  # Used instead of the line above if it was already said earlier in this chat (two separate stages failing back
  # to back) — so a second failure never repeats the exact same line either.
  fallback_reply_alt: "Isme thoda aur samay lagega, samajhne mein."
  health_reply: "Sehat ke liye doctor se zaroor milein."
  crisis_reply:                      # sent when a user shows distress; the sales card is NOT shown
    - "{name} ji, aap akele nahi hain."
    - "Aapki baat sunne wale log hain."
    - "Abhi Tele-MANAS 14416 par call karein. Free, 24 ghante."

# Optional line for the whole pilot (festival, big transit). "" = off.
monthly_line: ""

# Everyday words users type → topic. Used when the user names a topic mid-chat.
topics:
  shaadi: [shaadi, shadi, marriage, vivah, rishta, wife, husband, biwi, pati, patni]
  naukri: [naukri, job, career, kaam, business, vyapar, promotion, interview]
  paisa: [paisa, paise, money, dhan, loan, karz, income]
  parivaar: [parivaar, family, ghar, maa, papa, bachche, baccha, bacche, bachcha, bacha, santaan]
  pyaar: [pyaar, pyar, love, girlfriend, boyfriend, breakup, crush]
  sehat: [health, sehat, bimari, beemari, hospital, operation, dawai]

# Every AI reply is checked against these. A hit removes that bubble (and logs the reason);
# if nothing is left, fallback_reply is sent instead.
guardrails:
  banned:
    - { reason: date_or_year, pattern: '\b(19|20)\d{2}\b' }
    - { reason: date_or_year, pattern: '\b(january|february|march|april|june|july|august|september|october|november|december|janvari|farvari|tareekh|tarikh)\b' }
    # future timing only ("agle saal", "2 mahine mein"); the user's own past ("2 saal se") may be echoed back
    - { reason: relative_time, pattern: '\b(agl[aei]|aane wale|is|chand|kuch|ek[- ]do|do[- ]teen) (saal|sal|mahin[aeo]|mahino|hafte|hafton)\b|\b(do|teen|char|chaar|\d+) (saal|sal|mahine|mahino|hafte|hafton) (mein|me|ke andar|tak|baad)\b' }
    - { reason: remedy, pattern: '\b(mantra|jaap|jap|ratna|gemstone|pukhraj|neelam|gomed|moonga|panna|rudraksh\w*|vrat|daan kar\w*|puja karw\w*|havan)\b' }
    - { reason: money, pattern: '(₹|\brs\.?\s?\d|\brupay\w*|\brecharge\b|\bcashback\b|\bdiscount\b|\boffer\b|\bper minute\b|\bprice\b)' }
    - { reason: ai_mention, pattern: '\b(ai|a\.i\.|bot|chatbot|language model|gemini|gpt|openai|prompt)\b' }
    - { reason: fear, pattern: '\b(nazar|kala jaadu|kaala jadu|black magic|tona|totka|maut|death|accident|durghatna|bura samay|kharab samay)\b' }
    - { reason: guarantee, pattern: '(\b(pakk[aie]|guarantee|definitely|tay hai|nishchit)\b|100 ?%|\bzaroor\s+(\S+\s+)?\S*(ga|gi|ge|ngi|nge)\b)' }   # incl. "zaroor aayegi", "zaroor shuru hoga"
    - { reason: handoff_talk, pattern: '\b(pandit|panditji|astrologer se|baad mein bata\w*|agli baar|next time)\b' }   # the chat never points away from itself; the card does
    - { reason: human_claim, pattern: '(main (ek )?insaan|main real|i am (a )?human|i am real)' }
    - { reason: filler, pattern: '(checking your grahas|celestial|blueprint|please wait|ruko)' }
  crisis:
    - '\b(suicide|khudkushi|khud ?kushi|aatmahatya|self ?harm)\b'
    - '(marna chahta|marna chahti|mar jaun|mar jaunga|mar jaungi|jaan de d|jeene ka mann nahi|jeena nahi chahta|jeena nahi chahti)'
  injection:
    - '(ignore (all|previous|above)|system prompt|your instructions|developer mode|act as)'
  ai_question:
    - '(tum|aap) (ai|bot|robot|real|insaan|human)\b'
    - '\b(are you (an )?(ai|bot|real|human))\b'
    - '\b(ai ho|bot ho|real ho|insaan ho)\b'

# Where the CTA sends the user.
# v1: an AppsFlyer OneLink (deferred deep link) for everyone. Later: booking-initiation deep links (with balance
# → straight into a chat; no balance → recharge first), picked per user by wallet_balance — still via OneLink, so
# the destination survives an install in between, not just an already-installed app.
handoff:
  deeplink_with_balance: "https://astrolokal.onelink.me/IE0Y/wpa10g7p"   # v1: same OneLink for everyone (same as below)
  deeplink_no_balance: "https://astrolokal.onelink.me/IE0Y/wpa10g7p"     # v1: same OneLink for everyone (same as above)
  # Not used any more now that the deeplinks above are https (OneLink handles its own store-redirect when the app
  # isn't installed) — openApp()'s 1.5s-timeout fallback only applies to a non-https (custom scheme) deeplink.
  # Kept only as a safety net for handoffUrl()/validateConfig if a deeplink is ever reverted to a custom scheme.
  fallback_url: "https://play.google.com/store/apps/details?id=com.astrolokal.astrology"
  # Attribution on every tap: {token} {prompt_version} {cohort} {arm} {balance} (token is opaque, never a phone number)
  utm: "utm_source=wati&utm_campaign=ai_free_chat&utm_content={prompt_version}&utm_term={token}&cohort={cohort}&arm={arm}&bal={balance}"
  utm_on_app_links: false   # irrelevant now the deeplinks are https — https links always carry the UTM regardless

# What the chat uses. Switch off per cohort to test what actually moves the tap rate.
assets:
  kundli: true        # the kundli card + "Rashi X, dasha Y ki." with the first answer
  last_chat: true     # their last consult's summary goes into the prompt (so Omkar can refer to it)

# Who gets the chat. Every user in the list has a cohort; a cohort changes ONLY what is different for it
# (any section below except experiment). Empty = the main config as is. Bump prompt_version when you edit one.
default_cohort: lapsed
cohorts:
  lapsed: {}                  # anyone whose journey isn't listed below
  # Recharge-count buckets from the daily retargeting query (rc_bucket). Same experience for now; each gets its own
  # row in /admin, so we can see which bucket converts. Add overrides here to give a bucket its own hook or offer.
  rc1: {}
  rc2: {}
  rc3: {}
  rc4: {}
  rc5_plus: {}
  # Control groups (goodwill coins instead of free coins), kept separate so /admin can compare them with rc1–rc3
  rc1_control: {}
  rc2_control: {}
  rc3_control: {}
  # Phase 5: someone whose user_id Redash never sent us — they self-entered their own details instead.
  # Kept separate so /admin never mixes them into the real pilot's funnel numbers.
  self_serve: {}

